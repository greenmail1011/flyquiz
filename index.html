<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>飛答 FlyQuiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121c38'/%3E%3Cpath d='M14 40 L32 14 L50 40 L32 32 Z' fill='%23ff6b35'/%3E%3Ccircle cx='32' cy='47' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1ea; --ink:#16213a; --muted:#6b7189; --line:#e3ded3; --card:#ffffff; --soft:#ece7dc;
  --stage:#111a35; --stage2:#1b2850; --accent:#ff6b35; --accent2:#ff8a5c; --good:#22a867; --bad:#e5484d;
  --a:#e4572e; --b:#1a9a85; --c:#e09b00; --d:#6a4cc2; --e:#d6457f; --f:#2f7fd8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
pre.code{font-family:var(--mono);background:#0d1430;color:#e9edff;border-radius:.6em;padding:.7em 1em;margin:.5em 0;text-align:left;white-space:pre;overflow:auto;font-size:.82em;line-height:1.45}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:1.5px solid var(--line);background:var(--card);border-radius:.7em;padding:.55em 1em;font-weight:600;text-decoration:none;transition:transform .08s,background .15s}
.btn:hover{background:#faf8f3}
body.player .btn:not(.primary):not(.dark){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
body.player .btn:not(.primary):not(.dark):hover{background:rgba(255,255,255,.24)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.35em .7em;font-size:.9em}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:.6em;padding:.55em .75em;background:#fff;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical}
.oa{--oc:var(--a)}.ob{--oc:var(--b)}.oc{--oc:var(--c)}.od{--oc:var(--d)}.oe{--oc:var(--e)}.of{--oc:var(--f)}
.demo-badge{display:inline-block;background:#fff4d6;color:#7a5600;border:1px solid #f0d58a;border-radius:99px;padding:.2em .8em;font-size:.82rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:.6em 1.1em;border-radius:.7em;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s ease-out;font-size:.95rem;max-width:90vw}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#net{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:98;background:var(--bad);color:#fff;border-radius:99px;padding:.25em .9em;font-size:.85rem}
.modal-back{position:fixed;inset:0;background:rgba(10,15,35,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;color:var(--ink);border-radius:1rem;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:1.4rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3);font-size:1rem}
.modal h3{margin:0 0 .6rem;font-size:1.25rem}
.modal .mfoot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.center-msg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:.6rem}

/* ---------- 加入頁 ---------- */
.join{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:18px;background:
  radial-gradient(1200px 600px at 10% -10%,#ffe1d3 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#d9e6ff 0,transparent 60%),var(--bg)}
.brand{text-align:center}
.logo{font-weight:900;font-size:3rem;letter-spacing:.08em;line-height:1;color:var(--ink)}
.logo b{color:var(--accent)}
.tag{color:var(--muted);margin-top:.35rem}
.jcard{background:#fff;border-radius:1.2rem;box-shadow:0 10px 40px rgba(22,33,58,.12);padding:1.4rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:.75rem}
.jcard .big{font-size:1.6rem;text-align:center;letter-spacing:.25em;font-weight:800;padding:.5em}
.jcard .name{font-size:1.25rem;text-align:center;font-weight:700}
.jcard .btn{font-size:1.15rem;padding:.7em}
.jerr{color:var(--bad);text-align:center;min-height:1.2em;font-size:.95rem}
.hostlink{color:var(--muted);font-size:.92rem}

/* ---------- 題庫 ---------- */
.topbar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar .logo{font-size:1.4rem}
.topbar .sp{flex:1}
.acct{font-size:.9rem;color:var(--muted);max-width:18em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib{max-width:1040px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
.lib h1{font-size:1.5rem;margin:.2rem 0 1rem}
.lib-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.resume{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;background:#fff0e8;border:1.5px solid #ffc7ad;border-radius:.9rem;padding:.8rem 1rem;margin-bottom:1rem}
.resume .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.qcard{background:#fff;border:1.5px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem}
.qcard h3{margin:0;font-size:1.15rem;word-break:break-word}
.qcard .meta{color:var(--muted);font-size:.88rem}
.qcard .types{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.25em;background:var(--soft);border-radius:99px;padding:.1em .6em;font-size:.8rem}
.qcard .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.4rem}
.empty{border:2px dashed var(--line);border-radius:1rem;padding:2rem;text-align:center;color:var(--muted)}

/* ---------- 編輯器 ---------- */
.ed{height:100%;display:flex;flex-direction:column}
.title-in{font-size:1.15rem;font-weight:700;border:1.5px solid transparent;border-radius:.5em;padding:.3em .5em;min-width:12em;flex:1;max-width:28em;background:transparent}
.title-in:hover,.title-in:focus{border-color:var(--line);background:#fff;outline:none}
.saved{color:var(--muted);font-size:.85rem;min-width:4em}
.ed-body{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
.ed-list{border-right:1px solid var(--line);overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.4rem;background:#faf8f3}
.ed-item{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .65rem;border-radius:.7rem;border:1.5px solid transparent;background:#fff;cursor:pointer;text-align:left;width:100%}
.ed-item.sel{border-color:var(--accent);box-shadow:0 2px 10px rgba(255,107,53,.15)}
.ed-item .n{font-weight:800;color:var(--muted);min-width:1.4em}
.ed-item .t{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.92rem}
.ed-item .ty{font-size:.75rem;color:var(--muted);white-space:nowrap}
.ed-item.bad{border-color:#f3b4b6}
.ed-add{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.4rem}
.ed-add .btn{font-size:.85rem;padding:.4em .5em}
.ed-main{overflow:auto;padding:1.2rem 1.6rem 3rem}
.ed-main .inner{max-width:760px;display:flex;flex-direction:column;gap:1rem}
.fl{font-weight:700;font-size:.92rem;margin-bottom:.35rem;display:block}
.hint{color:var(--muted);font-size:.85rem}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:.3em .85em;font-size:.9rem}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.optrow{display:flex;gap:.5rem;align-items:center;margin-bottom:.45rem}
.optrow .lt{width:2rem;height:2rem;border-radius:.5rem;background:var(--oc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.optrow .ok{display:flex;align-items:center;gap:.3em;white-space:nowrap;font-size:.9rem;border:1.5px solid var(--line);border-radius:.6em;padding:.35em .6em;cursor:pointer;background:#fff}
.optrow .ok.on{background:#e3f7ec;border-color:var(--good);color:#11743f;font-weight:700}
.optrow .x{border:none;background:none;color:var(--muted);font-size:1.1rem;padding:.2em .4em}
.rowflex{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.tfpick{display:flex;gap:.6rem}
.tfpick button{flex:1;max-width:200px;padding:.8em;border-radius:.8em;border:2px solid var(--line);background:#fff;font-size:1.1rem;font-weight:700}
.tfpick button.on{border-color:var(--good);background:#e3f7ec;color:#11743f}
.preview-box{border:1.5px dashed var(--line);border-radius:.8rem;padding:.8rem 1rem;background:#fff}
@media (max-width:760px){.ed-body{grid-template-columns:1fr}.ed-list{border-right:none;border-bottom:1px solid var(--line);max-height:34vh}}

/* ---------- 主持（投影）畫面 ---------- */
body.stage{background:var(--stage);color:#fff;overflow:hidden}
.host{height:100vh;display:flex;flex-direction:column;font-size:clamp(9px,min(1.55vw,2.75vh),40px);
  background:radial-gradient(80em 40em at 85% -10%,rgba(255,107,53,.18),transparent 60%),radial-gradient(60em 40em at -10% 110%,rgba(47,127,216,.22),transparent 60%),var(--stage)}
.hbar{display:flex;align-items:center;gap:.8em;padding:.6em 1.2em;font-size:.9em}
.hbar .logo{color:#fff;font-size:1.6em}
.hbar .title{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30em}
.hbar .sp{flex:1}
.pinchip{background:#fff;color:var(--ink);border-radius:.5em;padding:.15em .7em;font-weight:800;letter-spacing:.12em}
.pc{display:flex;align-items:center;gap:.3em;opacity:.85}
.hbtn{background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:.5em;padding:.3em .6em;font-size:1em}
.hbtn:hover{background:rgba(255,255,255,.2)}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 2em}
.hctl{display:flex;align-items:center;gap:.6em;padding:.7em 1.2em 1em;justify-content:flex-end;font-size:.9em}
.hctl .tip{opacity:.5;margin-right:auto;font-size:.85em}
.sbtn{border:none;border-radius:.6em;padding:.55em 1.3em;font-weight:800;font-size:1.05em;background:rgba(255,255,255,.12);color:#fff}
.sbtn:hover{background:rgba(255,255,255,.22)}
.sbtn.go{background:var(--accent);box-shadow:0 .3em 0 #c24a1f}
.sbtn.go:hover{background:var(--accent2)}
.sbtn.go:active{transform:translateY(.15em);box-shadow:0 .15em 0 #c24a1f}

.lobby{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:2em;align-items:center;min-height:0}
.lobby-l .step{font-size:1.1em;opacity:.7;margin-top:.6em}
.lobby-l .url{font-size:1.9em;font-weight:800;word-break:break-all;line-height:1.2}
.lobby-l .bigpin{font-size:5.4em;font-weight:900;letter-spacing:.06em;line-height:1.05;color:#fff}
.qrbox{background:#fff;border-radius:1em;padding:.8em;justify-self:center;text-align:center;color:var(--ink);max-width:100%}
.qrbox img{width:min(14em,32vh);height:auto;display:block;image-rendering:pixelated}
.qrbox .small{font-size:.8em;margin-top:.3em}
.plist-wrap{padding:.6em 0 0;max-height:34%;display:flex;flex-direction:column;min-height:5em}
.plist-h{font-size:1em;opacity:.85;margin-bottom:.4em}
.plist-h b{font-size:1.4em;color:var(--accent2)}
.plist{display:flex;flex-wrap:wrap;gap:.45em;overflow:auto;align-content:flex-start}
.pchip{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:99px;padding:.25em .8em;font-weight:700;font-size:1em;animation:pop .25s}
.pchip:hover{background:var(--bad);text-decoration:line-through}

.qv{flex:1;display:flex;flex-direction:column;min-height:0;gap:.8em}
.q-meta{font-size:.95em;opacity:.7;display:flex;gap:.6em;align-items:center}
.x2{background:var(--accent);color:#fff;border-radius:.4em;padding:0 .5em;font-weight:800;opacity:1}
.q-text{max-height:55%;overflow:auto;flex:none;font-size:2.1em;font-weight:800;line-height:1.3;background:#fff;color:var(--ink);border-radius:.45em;padding:.45em .7em;text-align:center}
.q-text pre.code{font-size:.6em}
.q-mid{display:flex;align-items:center;justify-content:space-between;gap:1em;flex:1 0 auto;min-height:5.8em}
.ring{position:relative;width:5.5em;height:5.5em;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2em;font-weight:900}
.acount{text-align:center;line-height:1.1}
.acount b{font-size:2.6em;display:block}
.acount span{opacity:.7}
.q-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.opts.n5,.opts.n6{grid-template-columns:1fr 1fr 1fr}
.opt{background:var(--oc);border-radius:.5em;padding:.6em .8em;display:flex;align-items:center;gap:.6em;font-size:1.35em;font-weight:700;min-height:2.6em;transition:opacity .3s,filter .3s}
.opt .lt{width:1.7em;height:1.7em;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.opt .tx{flex:1}
.opt.dim{opacity:.28;filter:grayscale(.6)}
.opt .mk{font-size:1.2em}
.prep{display:none}
.qv.prepping .q-mid,.qv.prepping .opts,.qv.prepping .ordlist{display:none}
.qv.prepping .prep{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:.6em}
.prep-n{font-size:4em;font-weight:900}
.prep-bar{width:40%;height:.5em;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.prep-bar i{display:block;height:100%;background:var(--accent);width:0}
.ordlist{display:flex;flex-direction:column;gap:.4em}
.ord{background:rgba(255,255,255,.1);border-radius:.5em;padding:.45em .8em;font-size:1.3em;font-weight:700;display:flex;gap:.7em;align-items:center}
.ord .k{background:#fff;color:var(--ink);border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ord.good{background:var(--good)}
.hintbig{font-size:1.6em;opacity:.75;text-align:center}

.bars{display:flex;align-items:flex-end;justify-content:center;gap:1.2em;height:100%;max-height:12em;min-height:5em}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:5em;height:100%}
.bar .cnt{font-weight:900;font-size:1.4em}
.bar .col{width:100%;background:var(--oc);border-radius:.3em .3em 0 0;min-height:.3em;transition:height .6s cubic-bezier(.2,.9,.3,1.2)}
.bar .base{width:100%;background:var(--oc);text-align:center;font-weight:900;border-radius:0 0 .3em .3em;padding:.1em 0;filter:brightness(.85)}
.bar.dim{opacity:.3}
.summary{font-size:1.3em;text-align:center;opacity:.9}
.summary b{color:#7ff0b0;font-size:1.3em}
.tlist{display:flex;flex-direction:column;gap:.4em;min-width:50%}
.trow{display:flex;justify-content:space-between;gap:1em;background:rgba(255,255,255,.1);border-radius:.5em;padding:.4em .9em;font-size:1.25em;font-weight:700}
.trow.good{background:var(--good)}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.25em .7em;max-width:100%;padding:.5em;line-height:1.15}
.cw{font-weight:900;animation:pop .4s}
.cw sup{font-size:.4em;opacity:.7;margin-left:.15em}
.cw.c0{color:#ffb38f}.cw.c1{color:#7fe3cf}.cw.c2{color:#ffd56b}.cw.c3{color:#c2b2ff}.cw.c4{color:#ff9fc4}.cw.c5{color:#9cc8ff}

.board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em}
.board h2{font-size:2em;margin:0 0 .3em}
.brow{display:flex;align-items:center;gap:.8em;width:min(36em,90%);background:#fff;color:var(--ink);border-radius:.5em;padding:.45em .9em;font-size:1.3em;font-weight:800;animation:pop .3s backwards}
.brow .rk{width:1.6em;text-align:center;color:var(--muted)}
.brow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .dl{font-size:.75em;color:var(--good);min-width:4em;text-align:right}
.brow .sc{min-width:4em;text-align:right}
.brow .fire{font-size:.8em}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1em;flex:1;min-height:0;padding-top:1em}
.pod{display:flex;flex-direction:column;align-items:center;width:9em}
.pod .nm{font-weight:900;font-size:1.35em;text-align:center;word-break:break-all;line-height:1.2}
.pod .sc{opacity:.8;margin-bottom:.3em}
.pod .blk{width:100%;border-radius:.5em .5em 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:2.6em;font-weight:900;padding-top:.15em;animation:rise .8s cubic-bezier(.2,.9,.3,1.1) backwards}
.pod.p1 .blk{height:7.5em;background:linear-gradient(#ffcf4a,#e09b00);animation-delay:1.2s}
.pod.p2 .blk{height:5.2em;background:linear-gradient(#e3e8f2,#a9b3c7);color:var(--ink);animation-delay:.6s}
.pod.p3 .blk{height:3.8em;background:linear-gradient(#f1b48a,#c37445);animation-delay:0s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom;opacity:0}to{transform:scaleY(1);transform-origin:bottom;opacity:1}}
.rest{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em;padding:.6em 0;font-size:.95em;opacity:.85}

.present{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em}
.present h1{font-size:3em;margin:0;line-height:1.2}
.present .sub{opacity:.7;font-size:1.2em}
.present .sbtn{font-size:1.6em;padding:.5em 1.6em;margin-top:.6em}

/* ---------- 學員畫面 ---------- */
body.player{background:var(--stage);color:#fff}
.pl{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:rgba(0,0,0,.2);font-weight:700}
.pscore{background:#fff;color:var(--ink);border-radius:99px;padding:.1em .8em}
.ptime{height:6px;background:rgba(255,255,255,.12)}
.ptime i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
#pmain{flex:1;display:flex;flex-direction:column;padding:1rem;gap:1rem}
.pcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem}
.pbig{font-size:2rem;font-weight:900;line-height:1.2}
.pemo{font-size:4rem;line-height:1}
.pq-text{font-size:1.15rem;font-weight:700;background:#fff;color:var(--ink);border-radius:.7rem;padding:.7rem .9rem}
.pq-text pre.code{font-size:.8rem}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;flex:1}
.pans.n2{grid-template-columns:1fr}
.pbtn{background:var(--oc);border:none;color:#fff;border-radius:.9rem;font-weight:800;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.8rem .5rem;min-height:5.5rem;box-shadow:0 .3rem 0 rgba(0,0,0,.25);word-break:break-word}
.pbtn:active{transform:translateY(.2rem);box-shadow:none}
.pbtn .lt{font-size:1.6rem;font-weight:900;opacity:.9}
.ptype{display:flex;flex-direction:column;gap:.7rem}

/* ================= 資料後端：Firebase 或本機試玩 ================= */
function makeLocal() {
  const PFX = 'fd:';
  let uid = sessionStorage.getItem('fd-uid');
  if (!uid) { uid = 'u' + rand(10); sessionStorage.setItem('fd-uid', uid); }
  const subs = new Set();
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('feida-local') : null;
  const norm = p => String(p).split('/').filter(Boolean).join('/');
  const keys = () => { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(PFX) === 0) out.push(k); } return out; };
  function flatten(base, v, out) {
    if (v === null || v === undefined) return;
    if (typeof v === 'object' && !v['.sv']) {
      const ks = Object.keys(v);
      for (const k of ks) flatten(base ? base + '/' + k : k, v[k], out);
    } else out[base] = (typeof v === 'object') ? Date.now() : v;
  }
  function write(p, v) {
    p = norm(p);
    for (const k of keys()) { const kp = k.slice(PFX.length); if (kp === p || kp.indexOf(p + '/') === 0) localStorage.removeItem(k); }
    const parts = p.split('/'); for (let i = 1; i < parts.length; i++) localStorage.removeItem(PFX + parts.slice(0, i).join('/'));
    const out = {}; flatten(p, v, out);
    for (const k in out) localStorage.setItem(PFX + k, JSON.stringify(out[k]));
  }
  function read(p) {
    p = norm(p); let res = null;
    for (const k of keys()) {
      const kp = k.slice(PFX.length);
      if (kp === p) return JSON.parse(localStorage.getItem(k));
      if (p === '' || kp.indexOf(p + '/') === 0) {
        const rest = (p === '' ? kp : kp.slice(p.length + 1)).split('/');
        if (res === null) res = {};
        let o = res; for (let i = 0; i < rest.length - 1; i++) { if (typeof o[rest[i]] !== 'object' || o[rest[i]] === null) o[rest[i]] = {}; o = o[rest[i]]; }
        o[rest[rest.length - 1]] = JSON.parse(localStorage.getItem(k));
      }
    }
    return res;
  }
  function fire() { for (const s of subs) { const v = read(s.p); const j = JSON.stringify(v); if (j !== s.last) { s.last = j; try { s.cb(v); } catch (e) { console.error(e); } } } }
  function notify() { if (ch) ch.postMessage(1); fire(); }
  // 其他分頁的 localStorage 變更不一定比廣播訊息先到，所以兩種通知都聽，並合併成一次重讀
  let pend = null;
  const soon = () => { if (!pend) pend = setTimeout(() => { pend = null; fire(); }, 15); };
  if (ch) ch.onmessage = soon;
  window.addEventListener('storage', e => { if (!e.key || e.key.indexOf(PFX) === 0) soon(); });
  return {
    mode: 'local', uid,
    now: () => Date.now(),
    async get(p) { return read(p); },
    async set(p, v) { write(p, v); notify(); },
    async setOnce(p, v) { if (read(p) !== null) throw new Error('已經送出過了'); write(p, v); notify(); },
    async update(p, obj) { for (const k in obj) write(norm(p) + '/' + k, obj[k]); notify(); },
    async remove(p) { write(p, null); notify(); },
    on(p, cb) { const s = { p, cb, last: undefined }; subs.add(s); setTimeout(() => { if (!subs.has(s)) return; const v = read(p); s.last = JSON.stringify(v); cb(v); }, 0); return () => subs.delete(s); },
  };
}

let fbLoading = null;

    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';

  const auth = fbApp.auth();

  await auth.setPersistence(role === 'player' ? firebase.auth.Auth.Persistence.SESSION : firebase.auth.Auth.Persistence.LOCAL);
  let user = await new Promise(r => { const off = auth.onAuthStateChanged(u => { off(); r(u); }); });

  const db = fbApp.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  let first = true;
  db.ref('.info/connected').on('value', s => { if (s.val()) { first = false; setNet(true); } else if (!first) setNet(false); });

    mode: 'firebase',
    get uid() { return auth.currentUser ? auth.currentUser.uid : null; },
    user() { const u = auth.currentUser; return u ? { uid: u.uid, isAnonymous: u.isAnonymous, email: u.email || '', name: u.displayName || '' } : null; },
    async signInGoogle() {

    now: () => Date.now() + offset,
    async get(p) { return (await db.ref(p).get()).val(); },

  };

function newQ(type) {
  const q = { id: rand(6), type, text: '', options: [], correct: [], answers: [], time: 20, double: false };
  if (type === 'mc') { q.options = ['', '', '', '']; q.correct = [0]; }
  if (type === 'tf') { q.options = ['對', '錯']; q.correct = [0]; q.time = 10; }
  if (type === 'poll') { q.options = ['', '', '']; }
  if (type === 'order') { q.options = ['', '', '', '']; q.time = 30; }

}
function changeType(q, type) {

      '<div class="jerr" id="je"></div>' +

    '</form>' +

    try {
      await Account.signIn();
      const c = Store.localOnly();
      viewLibrary();
      if (c.length && !localStorage.getItem('feida-mig-' + Store.uid)) setTimeout(() => migrateDialog(c), 300);
      else toast('已登入，題庫會自動同步');
    } catch (e) { const t = authErrorText(e); if (t) alertBox('登入失敗', esc(t)); }
  };
  if ($('#signin')) $('#signin').onclick = doSignIn;
  if ($('#signin2')) $('#signin2').onclick = doSignIn;
  if ($('#signout')) $('#signout').onclick = async () => {
    if (!(await confirmBox('登出', '登出後，這台裝置只會顯示存在本機的題組。雲端題庫不會被刪除，重新登入就會回來。', '登出'))) return;
    await Account.signOut(); viewLibrary();
  };
  if ($('#migr')) $('#migr').onclick = () => migrateDialog(Store.localOnly());
  if (Store.mode === 'cloud') { const c = Store.localOnly(); if (c.length && !localStorage.getItem('feida-mig-' + Store.uid)) setTimeout(() => { if (!modalEl && location.hash === '#/host') migrateDialog(c); }, 300); }
  if ($('#closeold')) $('#closeold').onclick = async () => { if (be) await closeGame(be, sess.pin); HostSess.clear(); viewLibrary(); };
  $('#new').onclick = () => { const q = { id: rand(8), title: '新的題組', questions: [newQ('mc')] }; Store.put(q); location.hash = '#/edit/' + q.id; };
  $('#tpl').onclick = () => download('飛答題目範本.csv', '﻿' + TEMPLATE_CSV, 'text/csv;charset=utf-8');
  $('#impq').onclick = () => $('#fq').click();
  $('#fq').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; e.target.value = '';
    try {
      const res = rowsToQuestions(await readQuestionFile(f));
      if (!res.questions.length) { alertBox('沒有讀到題目', res.errors.map(esc).join('<br>') || '檔案是空的'); return; }
      const q = { id: rand(8), title: f.name.replace(/\.[^.]+$/, ''), questions: res.questions }; Store.put(q);
      if (res.errors.length) toast('已匯入 ' + res.questions.length + ' 題，另有 ' + res.errors.length + ' 列無法讀取', 4000);
      location.hash = '#/edit/' + q.id;
    } catch (err) { alertBox('匯入失敗', esc(err.message)); }
  };
  $('#impj').onclick = () => $('#fj').click();
  $('#fj').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; e.target.value = '';
    try {
      let data = JSON.parse(decodeText(await f.arrayBuffer()));
      data = Array.isArray(data) ? data : [data];
      data.forEach(d => { const q = normalizeQuiz(d); q.id = rand(8); delete q.pubId; Store.put(q); });
      toast('已匯入 ' + data.length + ' 個題組'); viewLibrary();
    } catch (err) { alertBox('匯入失敗', '這不是飛答的題組備份檔。'); }
  };
  $$('[data-start]').forEach(b => b.onclick = () => createGame(Store.get(b.dataset.start)));
  $$('[data-ppt]').forEach(b => b.onclick = () => pptDialog(Store.get(b.dataset.ppt)));
  $$('[data-exp]').forEach(b => b.onclick = () => { const q = Store.get(b.dataset.exp); const c = Object.assign({}, q); delete c.pubId; download(q.title + '.flyquiz.json', JSON.stringify(c, null, 2), 'application/json'); });
  $$('[data-del]').forEach(b => b.onclick = async () => { const q = Store.get(b.dataset.del); if (await confirmBox('刪除題組', '確定要刪除「' + esc(q.title) + '」嗎？刪除後無法復原。', '刪除', true)) { Store.del(q.id); viewLibrary(); } });
}

/* ================= 講師：編輯題組 ================= */
async function viewEditor(id) {
  if (CFG) { try { await Account.init(); } catch (e) {} }
  const quiz = Store.get(id);
  if (!quiz) { location.hash = '#/host'; return; }
  let sel = 0, saveT = null;
  app('<div class="ed"><div class="topbar"><a class="btn ghost sm" href="#/host">← 題庫</a><input class="title-in" id="tt" maxlength="60"><span class="saved" id="sv"></span><span class="sp"></span>' +
    '<button class="btn sm" id="imp">匯入題目</button><button class="btn sm" id="ppt">放進簡報</button><button class="btn primary" id="go">▶ 開始活動</button></div>' +
    '<div class="ed-body"><div class="ed-list" id="el"></div><div class="ed-main" id="em"></div></div></div>');
  $('#tt').value = quiz.title;
  const save = () => { $('#sv').textContent = '儲存中…'; clearTimeout(saveT); saveT = setTimeout(() => { Store.put(quiz); syncPublished(quiz); $('#sv').textContent = '已儲存'; }, 300); };
  onCleanup(() => { if (saveT) { clearTimeout(saveT); Store.put(quiz); syncPublished(quiz); } });
  $('#tt').oninput = () => { quiz.title = $('#tt').value; save(); };
  const drawList = () => {
    $('#el').innerHTML = quiz.questions.map((q, i) => '<button class="ed-item' + (i === sel ? ' sel' : '') + (questionProblems(q).length ? ' bad' : '') + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="t">' + (esc(plain(q.text)) || '<span class="muted">（空白題目）</span>') + '</span><span class="ty">' + TYPES[q.type].icon + ' ' + TYPES[q.type].name + '</span></button>').join('') +
      '<div class="hint" style="margin-top:.6rem">新增題目</div><div class="ed-add">' + Object.keys(TYPES).map(t => '<button class="btn" data-add="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].name + '</button>').join('') + '</div>';
    $$('[data-i]', $('#el')).forEach(b => b.onclick = () => { sel = +b.dataset.i; drawList(); drawMain(); });
    $$('[data-add]', $('#el')).forEach(b => b.onclick = () => { quiz.questions.splice(sel + 1, 0, newQ(b.dataset.add)); sel = Math.min(sel + 1, quiz.questions.length - 1); save(); drawList(); drawMain(); const t = $('#qt'); if (t) t.focus(); });
  };
  const refreshItem = () => {
    const q = quiz.questions[sel]; const b = $('[data-i="' + sel + '"]'); if (!b) return;
    $('.t', b).innerHTML = esc(plain(q.text)) || '<span class="muted">（空白題目）</span>';
    b.classList.toggle('bad', questionProblems(q).length > 0);
  };
  const drawMain = () => {
    const em = $('#em');
    const q = quiz.questions[sel];
    if (!q) { em.innerHTML = '<div class="empty">左邊選一種題型來新增題目</div>'; return; }
    let opts = '';
    if (q.type === 'mc' || q.type === 'poll') {
      opts = '<div><span class="fl">選項' + (q.type === 'mc' ? '（勾選正確答案，可多個）' : '') + '</span>' +
        q.options.map((o, i) => '<div class="optrow ' + OC[i] + '"><span class="lt">' + LT[i] + '</span><input class="in" data-o="' + i + '" maxlength="80" placeholder="選項 ' + LT[i] + '">' +
          (q.type === 'mc' ? '<label class="ok' + (q.correct.includes(i) ? ' on' : '') + '" data-c="' + i + '">' + (q.correct.includes(i) ? '✓ 正確' : '正確') + '</label>' : '') +
          (q.options.length > 2 ? '<button class="x" data-rm="' + i + '" title="刪除選項">✕</button>' : '') + '</div>').join('') +
        (q.options.length < 6 ? '<button class="btn sm" id="addo">＋ 選項</button>' : '') + '</div>';
    }
    if (q.type === 'tf') opts = '<div><span class="fl">正確答案</span><div class="tfpick"><button data-tf="0" class="' + (q.correct[0] === 0 ? 'on' : '') + '">⭕ 對</button><button data-tf="1" class="' + (q.correct[0] === 1 ? 'on' : '') + '">❌ 錯</button></div></div>';
    if (q.type === 'order') opts = '<div><span class="fl">項目（請照「正確順序」由上到下輸入，學生看到的會自動打亂）</span>' +
      q.options.map((o, i) => '<div class="optrow"><span class="lt" style="--oc:var(--ink)">' + (i + 1) + '</span><input class="in" data-o="' + i + '" maxlength="60" placeholder="第 ' + (i + 1) + ' 個">' + (q.options.length > 2 ? '<button class="x" data-rm="' + i + '">✕</button>' : '') + '</div>').join('') +
      (q.options.length < 6 ? '<button class="btn sm" id="addo">＋ 項目</button>' : '') + '</div>';
    if (q.type === 'type') opts = '<div><span class="fl">可接受的答案</span><div class="hint" style="margin-bottom:.4rem">比對時會忽略大小寫、空白、全半形與標點。可以填多種寫法，例如「4」和「四」。</div>' +
      q.answers.map((a, i) => '<div class="optrow"><input class="in" data-a="' + i + '" maxlength="40" placeholder="答案 ' + (i + 1) + '">' + (q.answers.length > 1 ? '<button class="x" data-rma="' + i + '">✕</button>' : '') + '</div>').join('') +
      (q.answers.length < 8 ? '<button class="btn sm" id="adda">＋ 另一種寫法</button>' : '') + '</div>';
    if (q.type === 'cloud') opts = '<div class="hint">學生各自輸入一個詞（最多 16 字），大螢幕會即時長出文字雲。不計分。</div>';
    if (q.type === 'poll') opts += '<div class="hint">投票不計分，公布時會顯示每個選項的票數。</div>';
    em.innerHTML = '<div class="inner">' +
      '<div><span class="fl">題型</span><div class="seg">' + Object.keys(TYPES).map(t => '<button data-ty="' + t + '" class="' + (t === q.type ? 'on' : '') + '">' + TYPES[t].icon + ' ' + TYPES[t].name + '</button>').join('') + '</div></div>' +
      '<div><span class="fl">題目</span><textarea class="in" id="qt" rows="4" maxlength="1200" placeholder="輸入題目。程式碼可以用 ``` 包起來，會以程式碼格式顯示。"></textarea></div>' +
      opts +
      '<div class="rowflex"><div><span class="fl">作答時間</span><select class="in" id="qtm" style="width:auto">' + TIMES.map(s => '<option value="' + s + '"' + (s === q.time ? ' selected' : '') + '>' + (s < 60 ? s + ' 秒' : (s / 60) + ' 分鐘') + '</option>').join('') + '</select></div>' +
      (TYPES[q.type].scored ? '<label class="rowflex" style="gap:.4rem;margin-top:1.4rem;cursor:pointer"><input type="checkbox" id="qdb"' + (q.double ? ' checked' : '') + '> 雙倍分數</label>' : '') + '</div>' +
      '<div class="rowflex"><button class="btn sm" id="mu">↑ 上移</button><button class="btn sm" id="md">↓ 下移</button><button class="btn sm" id="dup">複製這題</button><span class="sp" style="flex:1"></span><button class="btn sm danger" id="del">刪除這題</button></div>' +
      '<div class="hint" id="prob"></div>' +
      '</div>';
    $('#qt').value = q.text;
    $$('[data-o]', em).forEach(inp => { inp.value = q.options[+inp.dataset.o]; inp.oninput = () => { q.options[+inp.dataset.o] = inp.value; save(); refreshItem(); showProb(); }; });
    $$('[data-a]', em).forEach(inp => { inp.value = q.answers[+inp.dataset.a]; inp.oninput = () => { q.answers[+inp.dataset.a] = inp.value; save(); refreshItem(); showProb(); }; });
    $('#qt').oninput = () => { q.text = $('#qt').value; save(); refreshItem(); showProb(); };
    $$('[data-ty]', em).forEach(b => b.onclick = () => { if (b.dataset.ty === q.type) return; quiz.questions[sel] = changeType(q, b.dataset.ty); save(); drawList(); drawMain(); });
    $$('[data-c]', em).forEach(b => b.onclick = () => { const i = +b.dataset.c; q.correct = q.correct.includes(i) ? q.correct.filter(x => x !== i) : q.correct.concat(i).sort(); save(); drawMain(); refreshItem(); });
    $$('[data-rm]', em).forEach(b => b.onclick = () => { const i = +b.dataset.rm; q.options.splice(i, 1); q.correct = q.correct.filter(x => x !== i).map(x => x > i ? x - 1 : x); save(); drawMain(); refreshItem(); });
    $$('[data-rma]', em).forEach(b => b.onclick = () => { q.answers.splice(+b.dataset.rma, 1); save(); drawMain(); refreshItem(); });
    $$('[data-tf]', em).forEach(b => b.onclick = () => { q.correct = [+b.dataset.tf]; save(); drawMain(); });
    if ($('#addo')) $('#addo').onclick = () => { q.options.push(''); save(); drawMain(); const ins = $$('[data-o]'); ins[ins.length - 1].focus(); };
    if ($('#adda')) $('#adda').onclick = () => { q.answers.push(''); save(); drawMain(); const ins = $$('[data-a]'); ins[ins.length - 1].focus(); };
    $('#qtm').onchange = () => { q.time = +$('#qtm').value; save(); };
    if ($('#qdb')) $('#qdb').onchange = () => { q.double = $('#qdb').checked; save(); };
    $('#mu').onclick = () => { if (sel > 0) { const a = quiz.questions; [a[sel - 1], a[sel]] = [a[sel], a[sel - 1]]; sel--; save(); drawList(); drawMain(); } };
    $('#md').onclick = () => { const a = quiz.questions; if (sel < a.length - 1) { [a[sel + 1], a[sel]] = [a[sel], a[sel + 1]]; sel++; save(); drawList(); drawMain(); } };
    $('#dup').onclick = () => { const c = JSON.parse(JSON.stringify(q)); c.id = rand(6); quiz.questions.splice(sel + 1, 0, c); sel++; save(); drawList(); drawMain(); };
    $('#del').onclick = () => { quiz.questions.splice(sel, 1); sel = Math.max(0, Math.min(sel, quiz.questions.length - 1)); save(); drawList(); drawMain(); };
    showProb();
  };
  const showProb = () => { const q = quiz.questions[sel]; const p = $('#prob'); if (p && q) p.innerHTML = questionProblems(q).map(e => '<span style="color:var(--bad)">⚠ ' + esc(e) + '</span>').join('　'); };
  drawList(); drawMain();
  $('#go').onclick = () => { clearTimeout(saveT); saveT = null; Store.put(quiz); createGame(quiz); };
  $('#ppt').onclick = () => { clearTimeout(saveT); saveT = null; Store.put(quiz); pptDialog(quiz); };
  $('#imp').onclick = () => importDialog(qs => { quiz.questions = quiz.questions.filter(q => plain(q.text) || q.type !== 'mc' || q.options.some(Boolean)).concat(qs); sel = quiz.questions.length - qs.length; save(); drawList(); drawMain(); });
}
function importDialog(onAdd) {
  const m = showModal('<h3>匯入題目</h3>' +
    '<p class="hint" style="margin-top:0">欄位順序：<b>題型、題目、選項A、選項B、選項C、選項D、答案、秒數</b>。可直接從 Excel 複製貼上，或選擇 .xlsx / .csv 檔（Big5 編碼的 CSV 也能讀）。</p>' +
    '<div class="rowflex" style="margin-bottom:.6rem"><button class="btn sm" id="ifile">選擇檔案…</button><button class="btn sm ghost" id="itpl">下載範本</button><input type="file" id="if" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods" class="hidden"></div>' +
    '<textarea class="in" id="ita" rows="7" placeholder="或在這裡貼上 Excel 的表格內容…"></textarea>' +
    '<div id="ires" class="hint" style="margin-top:.6rem"></div>' +
    '<div class="mfoot"><button class="btn" data-x>取消</button><button class="btn primary" id="iok" disabled>加入題目</button></div>');
  let parsed = null;
  const show = rows => {
    parsed = rowsToQuestions(rows);
    $('#ires', m).innerHTML = '讀到 <b>' + parsed.questions.length + '</b> 題' + (parsed.errors.length ? '<div style="color:var(--bad);margin-top:.3rem">' + parsed.errors.slice(0, 8).map(esc).join('<br>') + (parsed.errors.length > 8 ? '<br>…' : '') + '</div>' : '');
    $('#iok', m).disabled = !parsed.questions.length;
  };
  $('[data-x]', m).onclick = closeModal;
  $('#itpl', m).onclick = () => download('飛答題目範本.csv', '﻿' + TEMPLATE_CSV, 'text/csv;charset=utf-8');
  $('#ifile', m).onclick = () => $('#if', m).click();
  $('#if', m).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { show(await readQuestionFile(f)); } catch (err) { $('#ires', m).textContent = '讀取失敗：' + err.message; } };
  $('#ita', m).oninput = () => { const t = $('#ita', m).value; if (t.trim()) show(parseDelimited(t)); };
  $('#iok', m).onclick = () => { if (parsed && parsed.questions.length) { onAdd(parsed.questions); closeModal(); toast('已加入 ' + parsed.questions.length + ' 題'); } };
}

/* ================= 放進 PowerPoint ================= */
async function pptDialog(quiz) {
  const errs = validateQuiz(quiz);
  if (errs.length) { alertBox('題組還有地方沒完成', errs.slice(0, 10).map(esc).join('<br>')); return; }
  let pubId;
  try { pubId = await publishQuiz(quiz); }
  catch (e) { alertBox('發布失敗', esc(e.message) + '<br><br>請確認 Firebase 設定與資料庫規則。'); return; }
  const url = presentUrl(pubId);
  const m = showModal('<h3>放進 PowerPoint</h3>' +
    '<p style="margin:.2rem 0 .6rem">這個題組的固定網址如下。之後修改題目會自動同步，<b>簡報不用重做</b>。</p>' +
    '<div class="copyrow"><input class="in" id="purl" readonly><button class="btn dark sm" id="pcopy">複製</button></div>' +
    (CFG ? '' : '<p class="hint" style="color:#7a5600">目前是試玩模式，這個網址只能在這台電腦的這個瀏覽器使用。設定好 Firebase 並上線後，就能在任何電腦的 PowerPoint 使用。</p>') +
    '<div class="tabs"><button data-tab="a" class="on">方法一：下載現成投影片（最簡單）</button><button data-tab="b">方法二：直接嵌入（2021 以後）</button></div>' +
    '<div data-pane="a"><ol class="embed-steps">' +
      '<li>按下面的按鈕下載一張投影片（.pptx）。</li>' +
      '<li>打開它，把這張投影片<b>複製貼到你的簡報</b>裡想要互動的位置。</li>' +
      '<li>放映時點 <b>▶ 開始互動</b>，會用瀏覽器全螢幕開啟；結束後按 <b>Alt+Tab</b> 切回簡報。所有 PowerPoint 版本都適用。</li>' +
    '</ol><button class="btn primary" id="pdl">下載投影片 (.pptx)</button></div>' +
    '<div data-pane="b" class="hidden"><ol class="embed-steps">' +
      '<li>在 PowerPoint 按 <b>插入 → 增益集 → 取得增益集</b>，搜尋並加入 <b>Web Viewer</b>（只需做一次）。</li>' +
      '<li>到要互動的投影片，按 <b>插入 → 我的增益集 → Web Viewer</b>。</li>' +
      '<li>貼上上面的網址（Web Viewer 會自動補 https://，若重複請刪掉一個），按 Preview，再把框拉滿整張投影片。</li>' +
      '<li>放映翻到這頁就是互動畫面，點「開啟房間」開始；翻到下一頁就繼續上課。</li>' +
    '</ol><p class="hint">建議同一張投影片也放上方法一的 ▶ 按鈕：遇到舊版 PowerPoint 無法嵌入時，畫面會提示改點按鈕。嵌入時建議用手機遙控（主持畫面右上角的「📱 遙控」），因為放映中按鍵盤會被 PowerPoint 接走。</p></div>' +
    '<div class="mfoot"><button class="btn" data-x>關閉</button><a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">在新分頁試開</a></div>');
  $('#purl', m).value = url;
  $('[data-x]', m).onclick = closeModal;
  $('#pcopy', m).onclick = async () => { try { await navigator.clipboard.writeText(url); toast('已複製網址'); } catch (e) { $('#purl', m).select(); document.execCommand('copy'); toast('已複製網址'); } };
  $$('[data-tab]', m).forEach(b => b.onclick = () => { $$('[data-tab]', m).forEach(x => x.classList.toggle('on', x === b)); $$('[data-pane]', m).forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.tab)); });
  $('#pdl', m).onclick = async () => {
    $('#pdl', m).disabled = true;
    try { await buildPptx(quiz.title, url); } catch (e) { alertBox('產生投影片失敗', esc(e.message)); }
    $('#pdl', m).disabled = false;
  };
}
async function buildPptx(title, url) {
  if (!window.PptxGenJS) await loadScript('lib/pptxgen.bundle.js');
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE'; // 16:9，13.33 x 7.5 吋
  const s = pptx.addSlide();
  s.background = { color: '111A35' };
  s.addText('課堂互動', { x: 0.8, y: 1.1, w: 11.7, h: 0.6, fontSize: 22, color: 'FF8A5C', bold: true, fontFace: 'Microsoft JhengHei' });
  s.addText(title, { x: 0.8, y: 1.7, w: 11.7, h: 1.6, fontSize: 44, color: 'FFFFFF', bold: true, fontFace: 'Microsoft JhengHei', valign: 'top' });
  s.addText([{ text: '▶  開始互動', options: { hyperlink: { url, tooltip: '用瀏覽器開啟互動畫面' } } }], {
    shape: pptx.ShapeType.roundRect, rectRadius: 0.2, x: 0.8, y: 3.9, w: 4.6, h: 1.2,
    fill: { color: 'FF6B35' }, color: 'FFFFFF', fontSize: 32, bold: true, align: 'center', valign: 'middle', fontFace: 'Microsoft JhengHei'
  });
  s.addText('放映時點按鈕，會用瀏覽器全螢幕開啟；結束後按 Alt+Tab 回到簡報。', { x: 0.8, y: 5.35, w: 11.7, h: 0.5, fontSize: 16, color: 'AEB6D0', fontFace: 'Microsoft JhengHei' });
  s.addText('飛答 FlyQuiz', { x: 0.8, y: 6.6, w: 6, h: 0.4, fontSize: 12, color: '6B7189', fontFace: 'Microsoft JhengHei' });
  s.addNotes('互動網址：' + url + '\n使用 PowerPoint 2021 以後的版本，也可以用「插入 → 我的增益集 → Web Viewer」把這個網址直接嵌入投影片。');
  await pptx.writeFile({ fileName: '飛答-' + title.replace(/[\\/:*?"<>|]/g, '') + '.pptx' });
}

/* ================= 講師：開房間 ================= */
async function closeGame(be, pin) {
  try { await be.remove('secrets/' + pin); } catch (e) {}
  try { await be.remove('games/' + pin); } catch (e) {}
}
async function createGame(quiz, pubId) {
  if (!quiz) return;
  const errs = validateQuiz(quiz);
  if (errs.length) { alertBox('題組還有地方沒完成', errs.slice(0, 12).map(esc).join('<br>')); return; }
  const be = await getBackend('host');
  const q = cleanQuiz(quiz);
  const old = HostSess.get();
  if (old && old.pin) await closeGame(be, old.pin);
  let lastErr = null;
  for (let i = 0; i < 6; i++) {
    const pin = String(100000 + Math.floor(Math.random() * 900000));
    try {
      if (await be.get('games/' + pin + '/state')) continue;
      const token = rand(12);
      await be.set('games/' + pin, { hostUid: be.uid, title: q.title || '未命名題組', createdAt: TS, teams: savedTeams(), state: { phase: 'lobby', total: q.questions.length } });
      await be.set('secrets/' + pin, { remoteToken: token });
      HostSess.save({ pin, quiz: q, perms: {}, token, pubId: pubId || null });
      location.hash = '#/game/' + pin;
      return;
    } catch (e) { lastErr = e; }
  }
  alertBox('無法建立房間', esc(lastErr ? lastErr.message : '請再試一次') + '<br><br>如果剛設定 Firebase，請確認已開啟「匿名登入」並貼上資料庫規則。');
}

/* ================= 講師：主持引擎 ================= */
class Engine {
  constructor(be, sess) { this.be = be; this.s = sess; this.pin = sess.pin; this.g = undefined; this.busy = false; this.done = new Set(); this.revealed = new Set(); this.knownRemotes = null; this.lastNext = 0; }
  path(p) { return 'games/' + this.pin + (p ? '/' + p : ''); }
  start(onChange, onTick) {
    this.off = this.be.on(this.path(), g => {
      this.g = g; if (g) { this.handleCommands(); this.watchRemotes(); }
      onChange(); this.checkAuto();
    });
    this.iv = setInterval(() => { this.checkAuto(); onTick(); }, 200);
  }
  stop() { if (this.off) this.off(); clearInterval(this.iv); }
  get st() { return (this.g && this.g.state) || { phase: 'lobby' }; }
  get quiz() { return this.s.quiz; }
  get perm() { return (this.s.perms || {})[this.st.qid]; }
  q(i) { return this.quiz.questions[i == null ? this.st.qIndex : i]; }
  players() { return (this.g && this.g.players) || {}; }
  nPlayers() { return Object.keys(this.players()).length; }
  teams() { return teamCfg(this.g); }
  moveTeam(uid, t) {
    if (!this.players()[uid]) return;
    const tc = this.teams();
    if (tc && t >= 0 && this.players()[uid].team !== t && teamCounts(tc, this.players(), uid)[t] >= tc.cap) { toast('「' + tc.names[t] + '」已滿（每組上限 ' + tc.cap + ' 人）'); return; }
    return this.be.update(this.path('players/' + uid), { team: t >= 0 ? t : null }).catch(e => toast('換組失敗：' + e.message));
  }
  randomTeams() {
    const tc = this.teams(); if (!tc) return;
    const ids = shuffle(Object.keys(this.players())); if (!ids.length) return;
    const upd = {}; let left = 0;
    ids.forEach((u, i) => { const ok = i < tc.n * tc.cap; upd['players/' + u + '/team'] = ok ? i % tc.n : null; if (!ok) left++; });
    return this.be.update(this.path(), upd).then(() => toast(left ? '已隨機分組；各組都滿了，還有 ' + left + ' 人沒有分到' : '已隨機平均分組')).catch(e => toast('分組失敗：' + e.message));
  }
  setTeams(count, names, cap) {
    const cur = this.teams();
    cap = Math.max(1, Math.min(99, Math.round(Number(cap)) || (cur && cur.cap) || TEAM_CAP));
    const v = count >= 2 ? { count, cap, names: (names || []).slice(0, count).map(x => String(x || '')) } : null;
    try { localStorage.setItem('feida-teams', JSON.stringify(v)); } catch (e) {}
    return this.be.set(this.path('teams'), v).catch(e => toast('設定分組失敗：' + e.message));
  }
  answers() { const qid = this.st.qid; return (qid && this.g && this.g.answers && this.g.answers[qid]) || {}; }
  nAnswered() { const p = this.players(); return Object.keys(this.answers()).filter(u => p[u]).length; }
  now() { return this.be.now(); }
  handleCommands() {
    const cmds = this.g.commands || {};
    Object.keys(cmds).forEach(id => {
      if (this.done.has(id)) return; this.done.add(id);
      const c = cmds[id]; this.be.remove(this.path('commands/' + id)).catch(() => {});
      if (c.at && Math.abs(this.now() - c.at) > 60000) return;
      if (c.c === 'next') this.next(true);
      if (c.c === 'add10') this.addTime(10);
      if (c.c === 'end') this.end();
    });
  }
  watchRemotes() {
    const ids = Object.keys(this.g.remotes || {});
    if (this.knownRemotes === null) { this.knownRemotes = new Set(ids); return; }
    const fresh = ids.filter(u => !this.knownRemotes.has(u));
    ids.forEach(u => this.knownRemotes.add(u));
    if (fresh.length) {
      // 每次有遙控器連上就換一組新的配對碼，舊的 QR code 立刻失效，避免學生掃到
      this.s.token = rand(12); HostSess.save(this.s);
      this.be.set('secrets/' + this.pin + '/remoteToken', this.s.token).catch(() => {});
      toast('📱 遙控器已連線'); if (this.onRemote) this.onRemote();
    }
  }
  async act(fn) { if (this.busy) return; this.busy = true; try { await fn(); } catch (e) { console.error(e); toast('操作失敗：' + e.message); } finally { this.busy = false; } }
  next(fromRemote) {
    if (!fromRemote && Date.now() - this.lastNext < 500) return; this.lastNext = Date.now();
    return this.act(async () => {
      const st = this.st, N = this.quiz.questions.length;
      if (st.phase === 'lobby') return this._start(0);
      if (st.phase === 'question') return this._reveal();
      if (st.phase === 'reveal' && TYPES[this.q().type].scored) return this.be.update(this.path('state'), { phase: 'board' });
      if (st.phase === 'reveal' || st.phase === 'board') return st.qIndex + 1 < N ? this._start(st.qIndex + 1) : this.be.update(this.path('state'), { phase: 'end' });
    });
  }
  reveal() { return this.act(() => this._reveal()); }
  end() { return this.act(() => this.be.update(this.path('state'), { phase: 'end' })); }
  addTime(sec) { if (this.st.phase === 'question') return this.be.update(this.path('state'), { endsAt: this.st.endsAt + sec * 1000 }); }
  kick(uid) { return this.be.update(this.path(), { ['players/' + uid]: null, ['scores/' + uid]: null, ['kicked/' + uid]: true }); }
  async _start(i) {
    const q = this.q(i); const qid = 'q' + i + '_' + rand(4);
    const pub = { qid, idx: i, total: this.quiz.questions.length, type: q.type, text: q.text, time: q.time, double: !!q.double };
    if (['mc', 'tf', 'poll'].includes(q.type)) pub.options = q.options;
    if (q.type === 'order') {
      const perm = shuffle(q.options.map((_, k) => k));
      if (perm.length > 1 && perm.every((v, k) => v === k)) perm.push(perm.shift());
      this.s.perms = Object.assign({}, this.s.perms, { [qid]: perm }); HostSess.save(this.s);
      pub.options = perm.map(j => q.options[j]);
    }
    const startedAt = this.now() + PREP_MS, endsAt = startedAt + q.time * 1000;
    await this.be.update(this.path(), { state: { phase: 'question', qIndex: i, qid, startedAt, endsAt, total: pub.total }, current: pub });
    this.be.set('secrets/' + this.pin + '/peek', { qid, text: answerText(q) }).catch(() => {});
  }
  async _reveal() {
    const st = this.st; if (st.phase !== 'question' || this.revealed.has(st.qid)) return;
    this.revealed.add(st.qid);
    const q = this.q(), ans = this.answers(), players = this.players(), scores = (this.g && this.g.scores) || {}, perm = this.perm;
    const upd = { 'state/phase': 'reveal', 'current/reveal': revealPayload(q, perm), 'current/stats': computeStats(q, ans, players, perm) };
    if (TYPES[q.type].scored) {
      const T = q.time * 1000; const next = {};
      Object.keys(players).forEach(uid => {
        const prev = scores[uid] || { score: 0, streak: 0 }; const a = ans[uid];
        const ok = !!a && checkAnswer(q, a.v, perm);
        const streak = ok ? (prev.streak || 0) + 1 : 0;
        let pts = 0;
        if (ok) { const t = Math.max(0, Math.min(T, (a.at || 0) - st.startedAt)); pts = Math.round(1000 * (1 - t / T / 2)) * (q.double ? 2 : 1) + Math.min(streak - 1, 5) * 100; }
        next[uid] = { score: (prev.score || 0) + pts, streak, last: { qid: st.qid, ok, pts, answered: !!a }, prevRank: prev.rank || 0 };
      });
      Object.keys(next).sort((a, b) => next[b].score - next[a].score).forEach((uid, k) => { next[uid].rank = k + 1; upd['scores/' + uid] = next[uid]; });
      const tc = this.teams();
      if (tc) upd['teamBoard'] = teamStandings(tc, players, uid => next[uid] ? next[uid].score : 0).map(r => ({ t: r.t, avg: r.avg, n: r.n, rank: r.rank }));
    }
    await this.be.update(this.path(), upd);
    Sound.chime();
  }
  checkAuto() {
    const st = this.st; if (!this.g || st.phase !== 'question' || this.revealed.has(st.qid)) return;
    const now = this.now();
    if (now >= st.endsAt) return this.reveal();
    const n = this.nPlayers();
    if (n > 0 && now > st.startedAt && this.nAnswered() >= n) return this.reveal();
  }
  ranked() {
    const p = this.players(), s = (this.g && this.g.scores) || {};
    return Object.keys(p).map(uid => ({ uid, name: p[uid].name, team: p[uid].team, score: (s[uid] && s[uid].score) || 0, last: s[uid] && s[uid].last, streak: (s[uid] && s[uid].streak) || 0 }))
      .sort((a, b) => b.score - a.score || String(a.name).localeCompare(String(b.name)));
  }
}

function renderStage(eng) {

    const rows = teamStandings(tc, eng.players(), u => sm[u] || 0);
    const max = Math.max.apply(null, [1].concat(rows.map(x => x.avg)));
    const mvp = r.slice(0, 3).map(x => esc(x.name) + (typeof x.team === 'number' && x.team >= 0 && x.team < tc.n ? '（' + esc(tc.names[x.team]) + '）' : '') + ' ' + x.score).join('、') || '—';
    if (st.phase === 'board') {
      stage.innerHTML = '<div class="board"><h2>🏆 組別排行</h2>' + rows.map((x, i) => '<div class="trow2 ' + OC[x.t] + (x.n ? '' : ' empty') + '" style="animation-delay:' + (i * .1) + 's"><span class="rk">' + x.rank + '</span><span class="nm"><i></i>' + esc(x.name) + ' <small>' + x.n + ' 人</small></span><span class="tb"><i style="width:' + (100 * x.avg / max).toFixed(1) + '%"></i></span><span class="sc">' + x.avg + '</span></div>').join('') +
        '<div class="mvp">組別分數＝組員平均分　·　個人前三：' + mvp + '</div></div>';
      return;
    }
    const live = rows.filter(x => x.n);
    const pod = (x, cls, n) => x ? '<div class="pod ' + cls + '"><div class="nm">' + esc(x.name) + '</div><div class="sc">平均 ' + x.avg + ' 分 · ' + x.n + ' 人</div><div class="blk">' + n + '</div></div>' : '<div class="pod ' + cls + '"></div>';
    stage.innerHTML = '<div class="podium">' + pod(live[1], 'p2', 2) + pod(live[0], 'p1', 1) + pod(live[2], 'p3', 3) + '</div>' +
      '<div class="rest">' + live.slice(3).map(x => '<span class="chip" style="background:rgba(255,255,255,.12)">' + x.rank + '. ' + esc(x.name) + ' · ' + x.avg + '</span>').join('') + '<span class="chip" style="background:rgba(255,255,255,.12)">個人 MVP：' + mvp + '</span></div>';
    if (live.length) Sound.chime();
    return;
  }
  const q = eng.q(), cur = (eng.g && eng.g.current) || {};
  const opts = toArr(cur.options);
  const meta = '<div class="q-meta"><span>第 ' + (st.qIndex + 1) + ' / ' + eng.quiz.questions.length + ' 題</span><span>' + TYPES[q.type].icon + ' ' + TYPES[q.type].name + '</span>' + (q.double ? '<span class="x2">雙倍分數</span>' : '') + '</div>';
  if (st.phase === 'question') {
    let center = '';
    if (['mc', 'tf', 'poll'].includes(q.type)) center = '';
    else if (q.type === 'order') center = '<div class="ordlist" style="min-width:50%">' + opts.map((o, i) => '<div class="ord"><span class="k">?</span>' + esc(o) + '</div>').join('') + '</div>';
    else if (q.type === 'cloud') center = '<div id="lcloud" style="width:100%"></div>';
    else center = '<div class="hintbig">✎ 請在你的裝置上輸入答案</div>';
    stage.innerHTML = '<div class="qv">' + meta + '<div class="q-text">' + fmt(q.text) + '</div>' +
      '<div class="q-mid"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle id="tring" cx="50" cy="50" r="45" fill="none" stroke="#ff6b35" stroke-width="8" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0"/></svg><span class="num" id="tnum">' + q.time + '</span></div>' +
      '<div class="q-center">' + center + '</div><div class="acount"><b id="acount">0</b><span>/ <i id="apc">0</i> 已作答</span></div></div>' +
      (['mc', 'tf', 'poll'].includes(q.type) ? '<div class="opts n' + opts.length + '">' + opts.map((o, i) => '<div class="opt ' + OC[i] + '"><span class="lt">' + LT[i] + '</span><span class="tx">' + esc(o) + '</span></div>').join('') + '</div>' : '') +
      '<div class="prep"><div style="font-size:1.3em;opacity:.8">準備作答</div><div class="prep-n" id="prepn">3</div><div class="prep-bar"><i></i></div></div></div>';
    return;
  }
  if (st.phase === 'reveal') {
    const stats = cur.stats || {}, rv = cur.reveal || {}, n = stats.n || 0;
    let body = '', summary = '';
    if (['mc', 'tf', 'poll'].includes(q.type)) {
      const counts = toArr(stats.counts), max = Math.max(1, Math.max.apply(null, counts.concat([0])));
      const corr = toArr(rv.correct);
      const isC = i => q.type === 'poll' || corr.includes(i);
      body = '<div class="bars">' + opts.map((o, i) => '<div class="bar ' + OC[i] + (isC(i) ? '' : ' dim') + '"><div class="cnt">' + (counts[i] || 0) + '</div><div class="col" style="height:' + (85 * (counts[i] || 0) / max).toFixed(1) + '%"></div><div class="base">' + LT[i] + (q.type !== 'poll' && corr.includes(i) ? ' ✓' : '') + '</div></div>').join('') + '</div>';
      body = '<div style="display:flex;flex-direction:column;gap:.8em;flex:1;min-height:0;justify-content:flex-end">' + body + '<div class="opts n' + opts.length + '">' + opts.map((o, i) => '<div class="opt ' + OC[i] + (isC(i) ? '' : ' dim') + '"><span class="lt">' + LT[i] + '</span><span class="tx">' + esc(o) + '</span>' + (q.type !== 'poll' && corr.includes(i) ? '<span class="mk">✓</span>' : '') + '</div>').join('') + '</div></div>';
      if (q.type !== 'poll') summary = '<div class="summary">答對 <b>' + (stats.right || 0) + '</b> / ' + eng.nPlayers() + ' 人</div>';
      else summary = '<div class="summary">共 ' + n + ' 票</div>';
    } else if (q.type === 'type') {
      body = '<div class="q-center" style="flex-direction:column;gap:.8em"><div class="summary">正確答案：<b>' + esc(toArr(rv.answers).join(' / ')) + '</b></div><div class="tlist">' +
        toArr(stats.top).map(t => '<div class="trow' + (t.ok ? ' good' : '') + '"><span>' + esc(t.t) + '</span><span>' + t.n + ' 人</span></div>').join('') + '</div></div>';
      summary = '<div class="summary">答對 <b>' + (stats.right || 0) + '</b> / ' + eng.nPlayers() + ' 人</div>';
    } else if (q.type === 'order') {
      const ord = toArr(rv.order);
      body = '<div class="q-center"><div class="ordlist" style="min-width:50%">' + ord.map((j, k) => '<div class="ord good"><span class="k">' + (k + 1) + '</span>' + esc(opts[j]) + '</div>').join('') + '</div></div>';
      summary = '<div class="summary">排對 <b>' + (stats.right || 0) + '</b> / ' + eng.nPlayers() + ' 人</div>';
    } else if (q.type === 'cloud') {
      body = '<div class="q-center">' + cloudHTML(toArr(stats.words)) + '</div>';
      summary = '<div class="summary">共 ' + n + ' 人回答</div>';
    }
    stage.innerHTML = '<div class="qv">' + meta + '<div class="q-text" style="font-size:1.5em">' + fmt(q.text) + '</div>' + body + summary + '</div>';
    return;
  }
  if (st.phase === 'board') {
    const top = eng.ranked().slice(0, 5);
    stage.innerHTML = '<div class="board"><h2>🏆 排行榜</h2>' + (top.length ? top.map((p, i) => '<div class="brow" style="animation-delay:' + (i * .12) + 's"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + (p.streak > 2 ? ' <span class="fire">🔥' + p.streak + '</span>' : '') + '</span><span class="dl">' + (p.last && p.last.pts ? '+' + p.last.pts : '') + '</span><span class="sc">' + p.score + '</span></div>').join('') : '<div class="hintbig">還沒有學員</div>') + '</div>';
    return;
  }
  if (st.phase === 'end') {
    const r = eng.ranked();
    const pod = (p, cls, n) => p ? '<div class="pod ' + cls + '"><div class="nm">' + esc(p.name) + '</div><div class="sc">' + p.score + ' 分</div><div class="blk">' + n + '</div></div>' : '<div class="pod ' + cls + '"></div>';
    stage.innerHTML = '<div class="podium">' + pod(r[1], 'p2', 2) + pod(r[0], 'p1', 1) + pod(r[2], 'p3', 3) + '</div>' +
      (r.length > 3 ? '<div class="rest">' + r.slice(3, 15).map((p, i) => '<span class="chip" style="background:rgba(255,255,255,.12)">' + (i + 4) + '. ' + esc(p.name) + ' · ' + p.score + '</span>').join('') + '</div>' : '');
    if (r.length) Sound.chime();
  }
}
/* 講師拖曳換組：用 pointer 事件，滑鼠與觸控螢幕都能用 */
function enableTeamDrag(pl, eng) {
  if (pl.dataset.drag) return; pl.dataset.drag = '1';
  pl.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.pchip');
    if (!chip || !eng.teams() || (e.button && e.button !== 0)) return;
    const d = { uid: chip.dataset.k, x: e.clientX, y: e.clientY, on: false, ghost: null, over: null };
    const setOver = el => { if (d.over === el) return; if (d.over) d.over.classList.remove('dropok'); d.over = el; if (el) el.classList.add('dropok'); };
    const move = ev => {
      if (!d.on) {
        if (Math.hypot(ev.clientX - d.x, ev.clientY - d.y) < 6) return;
        d.on = true; d.ghost = chip.cloneNode(true); d.ghost.className = 'pchip drag-ghost';
        ($('.host') || document.body).appendChild(d.ghost); chip.classList.add('dragging');
      }
      ev.preventDefault();
      d.ghost.style.left = ev.clientX + 'px'; d.ghost.style.top = ev.clientY + 'px';
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      setOver(el && el.closest('.tgrp'));
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (!d.on) return;
      chip.classList.remove('dragging'); d.ghost.remove();
      const tg = d.over; setOver(null);
      chip.dataset.dragged = '1'; setTimeout(() => { delete chip.dataset.dragged; }, 80);
      if (tg) eng.moveTeam(d.uid, Number(tg.dataset.t));
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}
function patchStage(eng) {
  const st = eng.st;
  if (st.phase === 'lobby') {
    const p = eng.players(), pl = $('#plist'); if (!pl) return;
    const ids = Object.keys(p).sort((a, b) => (p[a].at || 0) - (p[b].at || 0));
    $('#lpc').textContent = ids.length;
    const tc = eng.teams();
    const tOf = u => { const t = p[u].team; return tc && typeof t === 'number' && t >= 0 && t < tc.n ? t : -1; };
    const sig = ids.map(u => u + ':' + tOf(u)).join(',') + '|' + (tc ? tc.names.join(',') + ':' + tc.cap : '');
    if (pl.dataset.sig === sig) return; pl.dataset.sig = sig;
    const chip = u => '<button class="pchip" data-k="' + u + '" title="點一下移出">' + esc(p[u].name) + '</button>';
    pl.classList.toggle('teamed', !!tc);
    const lh = $('#lhint'); if (lh) lh.textContent = tc ? '　拖曳名字可以換組・點一下可以移出' : '　點名字可以移出';
    enableTeamDrag(pl, eng);
    if (!tc) pl.innerHTML = ids.map(chip).join('');
    else {
      const none = ids.filter(u => tOf(u) < 0);
      pl.innerHTML = tc.names.map((nm, t) => { const mem = ids.filter(u => tOf(u) === t); const cnt = mem.length > tc.cap ? '<span class="over">' + mem.length + ' / ' + tc.cap + '</span>' : mem.length === tc.cap ? '<span class="full">已滿 ' + tc.cap + '</span>' : '<span>' + mem.length + ' / ' + tc.cap + '</span>';
        return '<div class="tgrp ' + OC[t] + '" data-t="' + t + '"><div class="tgh"><span>' + esc(nm) + '</span>' + cnt + '</div><div class="tgl">' + mem.map(chip).join('') + '</div></div>'; }).join('') +
        (none.length ? '<div class="tgrp none" data-t="-1"><div class="tgh"><span>還沒選組</span><span>' + none.length + '</span></div><div class="tgl">' + none.map(chip).join('') + '</div></div>' : '');
    }
    $$('[data-k]', pl).forEach(b => b.onclick = async () => {
      if (b.dataset.dragged) return; if (await confirmBox('移出學員', '要把「' + esc(p[b.dataset.k].name) + '」移出這場活動嗎？', '移出', true)) eng.kick(b.dataset.k); });
  }
  if (st.phase === 'question') {
    const a = $('#acount'); if (a) a.textContent = eng.nAnswered();
    const pc = $('#apc'); if (pc) pc.textContent = eng.nPlayers();
    const lc = $('#lcloud');
    if (lc) { const s = computeStats(eng.q(), eng.answers(), eng.players()); lc.innerHTML = cloudHTML(s.words); }
  }
}

/* ================= 遙控器 ================= */
async function viewRemote(pin, token) {
  document.body.className = 'remote';
  app('<div class="rm"><div class="center-msg">連線中…</div></div>');
  const be = await getBackend('host');
  const mine = 'games/' + pin + '/remotes/' + be.uid;
  let ok = !!(await be.get(mine).catch(() => null));
  if (!ok) {
    try {
      if (be.mode === 'local' && (await be.get('secrets/' + pin + '/remoteToken')) !== token) throw new Error('bad');
      await be.set(mine, token); ok = true;
    } catch (e) { ok = false; }
  }
  if (!ok) { app('<div class="rm"><div class="center-msg"><div class="pemo">🔒</div><h2>遙控連結已失效</h2><p class="muted">每個遙控 QR code 只能用一次。請在主持畫面按「📱 遙控」重新掃描。</p></div></div>'); return; }
  app('<div class="rm"><div class="rm-h"><span>📱 遙控器</span><span class="pinchip" style="font-size:.9rem">PIN ' + fmtPin(pin) + '</span></div>' +
    '<div class="rm-card"><div class="rm-phase" id="rph"></div><div class="rm-q" id="rq"></div><div class="rm-text" id="rtx"></div></div>' +
    '<div class="rm-stats"><div class="rm-card"><b id="rpl">0</b><span>學員</span></div><div class="rm-card"><b id="ran">–</b><span>已作答</span></div><div class="rm-card"><b id="rti">–</b><span>剩餘秒數</span></div></div>' +
    '<div class="rm-peek hidden" id="rpk"><span>正確答案（只有你看得到）</span><b id="rpkt"></b></div>' +
    '<button class="rm-main" id="rmain">…</button>' +
    '<div class="rm-row"><button id="radd">+10 秒</button><button id="rlock">' + (('wakeLock' in navigator) ? '保持螢幕亮著' : '　') + '</button></div>' +
    '<button class="rm-end" id="rend">結束活動</button></div>');
  let g = null, peek = null;
  const send = c => be.set('games/' + pin + '/commands/' + Date.now().toString(36) + rand(4), { c, at: TS }).catch(e => toast('送出失敗：' + e.message));
  const draw = () => {
    if (g === null) { $('#rph').textContent = '活動已關閉'; $('#rmain').disabled = true; return; }
    if (!g) return;
    const st = g.state || { phase: 'lobby' }, cur = g.current || {}, players = g.players || {};
    const np = Object.keys(players).length;
    const names = { lobby: '等待學員加入', question: '作答中', reveal: '公布答案', board: '排行榜', end: '活動結束' };
    $('#rph').textContent = names[st.phase] || '';
    $('#rpl').textContent = np;
    const inQ = st.phase !== 'lobby' && cur.qid === st.qid;
    $('#rq').textContent = inQ ? '第 ' + (cur.idx + 1) + ' / ' + cur.total + ' 題 · ' + TYPES[cur.type].name : (g.title || '');
    $('#rtx').textContent = inQ ? plain(cur.text) : '';
    const ans = (st.qid && g.answers && g.answers[st.qid]) || {};
    $('#ran').textContent = st.phase === 'question' ? Object.keys(ans).filter(u => players[u]).length : '–';
    const showPeek = peek && peek.qid === st.qid && (st.phase === 'question' || st.phase === 'reveal');
    $('#rpk').classList.toggle('hidden', !showPeek); if (showPeek) $('#rpkt').textContent = peek.text;
    const last = st.qIndex + 1 >= (st.total || 0);
    const scored = cur.type && TYPES[cur.type].scored;
    const label = { lobby: '▶ 開始', question: '立即截止', reveal: scored ? '看排行榜' : (last ? '看最終結果' : '下一題 ▶'), board: last ? '看最終結果' : '下一題 ▶', end: '已結束' }[st.phase];
    $('#rmain').textContent = label; $('#rmain').disabled = st.phase === 'end';
    $('#radd').disabled = st.phase !== 'question';
  };
  const tick = () => {
    if (!g || !g.state || g.state.phase !== 'question') { $('#rti').textContent = '–'; return; }
    $('#rti').textContent = Math.max(0, Math.ceil((g.state.endsAt - be.now()) / 1000));
  };
  const offs = [be.on('games/' + pin, v => { g = v; draw(); }), be.on('secrets/' + pin + '/peek', v => { peek = v; draw(); })];
  const iv = setInterval(tick, 300);
  let lock = null;
  onCleanup(() => { offs.forEach(f => f()); clearInterval(iv); if (lock) lock.release().catch(() => {}); });
  $('#rmain').onclick = () => { if (navigator.vibrate) navigator.vibrate(30); send('next'); };
  $('#radd').onclick = () => send('add10');
  $('#rend').onclick = async () => { if (await confirmBox('結束活動', '直接跳到最終結果？', '結束', true)) send('end'); };
  $('#rlock').onclick = async () => { try { lock = await navigator.wakeLock.request('screen'); toast('螢幕會保持亮著'); } catch (e) {} };
}

window.addEventListener('hashchange', route);
route();
})();
